<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seite nicht gefunden – NotenPilot</title><style>body{font-family:system-ui,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;background:#f7f8fb;color:#182033}.c{max-width:520px;padding:32px;text-align:center;background:#fff;border:1px solid #e3e7ee;border-radius:24px;box-shadow:0 12px 32px rgba(24,32,51,.08)}a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:13px;background:#f97316;color:#fff;text-decoration:none;font-weight:800}</style></head><body><main class="c"><h1>Seite nicht gefunden</h1><p>Diese Adresse gehört nicht zu einer NotenPilot-Seite.</p><a id="home" href="./">Zur Startseite</a></main><script>const p=location.pathname.split('/').filter(Boolean);const project=location.hostname.endsWith('.github.io')&&p.length>1?'/'+p[0]+'/':'/';document.getElementById('home').href=project;</script></body></html>
